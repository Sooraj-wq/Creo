name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Greetings coder! Thank you for raising an issue, we would appreciate a PR from you!"
        pr-message: "This PR might fix the pipeline... or might summon Skynet. 50/50."
